# Cloudflare settings for the GIG Creative Hub server (used by the `wrangler` tool).
# Deploy from this folder with:  npx wrangler deploy

name = "gig-hub-api"
main = "worker.js"
compatibility_date = "2025-09-01"

# Data: talents, links, approvals, usage, print orders…
[[d1_databases]]
binding = "DB"
database_name = "gig-hub"
database_id = "8ae551d8-e332-4889-9a5c-0f2d83417190"

# Files: photos, videos, brand kit, creator uploads, print artwork
[[r2_buckets]]
binding = "FILES"
bucket_name = "gig-hub-files"

[observability]
enabled = true

# Where the website lives — used in the "forgot passcode" email link.
[vars]
SITE_URL = "https://chriyenterl.github.io/gig-creative-hub/"
# MAIL_FROM = "GIG <noreply@yourdomain.com>"   # once your domain is verified in Resend
# Then: npx wrangler secret put RESEND_API_KEY
