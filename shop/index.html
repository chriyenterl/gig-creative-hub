<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <script>var t = new URLSearchParams(location.search).get('theme'); if (t) document.documentElement.dataset.theme = t;</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Order online</title>
  <meta name="description" content="Order online for pickup or delivery." />
  <meta name="theme-color" content="#fbf6ef" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23d9a066'/%3E%3Ccircle cx='11' cy='12' r='2.4' fill='%235b3720'/%3E%3Ccircle cx='19' cy='10' r='2' fill='%235b3720'/%3E%3Ccircle cx='21' cy='18' r='2.6' fill='%235b3720'/%3E%3Ccircle cx='13' cy='20' r='2.2' fill='%235b3720'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="../css/shop.css" />
</head>
<body>
  <div id="app"><div class="sf-boot" data-boot><div class="sf-spinner"></div></div></div>
  <noscript><p style="padding:24px">Please turn on JavaScript to order from this page.</p></noscript>
  <script type="module" src="../js/shop/storefront.js"></script>
  <script>
    // If the store hasn't started after 15s (e.g. blocked network), say so instead of spinning forever.
    setTimeout(function () {
      var boot = document.querySelector('[data-boot]');
      if (boot) boot.outerHTML = '<div class="sf-state"><h1>Still loading…</h1>' +
        '<p>Please check your internet connection and refresh the page.</p></div>';
    }, 15000);
  </script>
</body>
</html>
